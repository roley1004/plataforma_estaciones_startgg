version: '3.9'

# Archivo preparado para futuro despliegue en la nube o contenedores.
# Para desarrollo local en Windows, puedes usar directamente tu PostgreSQL local en el puerto 5432.

services:
  postgres:
    image: postgres:16-alpine
    container_name: startgg_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-plataforma_startgg}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: startgg_platform_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-plataforma_startgg}?schema=public
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      STARTGG_SYSTEM_API_TOKEN: ${STARTGG_SYSTEM_API_TOKEN:-}
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: startgg_platform_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres_data:
